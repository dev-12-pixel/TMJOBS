version: '3.8'
services:
  supabase:
    image: supabase/supabase:latest
    ports:
      - "5432:5432"
      - "5433:5433"
      - "8000:8000"
    environment:
      - SUPABASE_DB_HOST=db
      - SUPABASE_DB_PORT=5432
      - SUPABASE_DB_NAME=postgres
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
    volumes:
      - supabase-data:/var/lib/postgresql/data

volumes:
  supabase-data:
